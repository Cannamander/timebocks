  <line x1="72" y1="87" x2="70" y2="95" stroke="#2C1808" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="88" x2="64" y2="96" stroke="#2C1808" stroke-width="2" stroke-linecap="round"/>
  <!-- left foot -->
