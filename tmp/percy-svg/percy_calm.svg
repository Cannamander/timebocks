  <path d="M-34,-4 Q-22,-9 -10,-5" stroke="#2C1808" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M10,-5 Q22,-9 34,-4" stroke="#2C1808" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="-34" cy="22" rx="9" ry="5.5" fill="#F09080" opacity="0.38"/>
  <ellipse cx="34" cy="22" rx="9" ry="5.5" fill="#F09080" opacity="0.38"/>
