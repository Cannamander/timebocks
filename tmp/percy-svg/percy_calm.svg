  <ellipse cx="16" cy="28" rx="6" ry="8" fill="#FF9E9E" stroke="#2C1808" stroke-width="2"/>
  <!-- beak closed -->
  <path d="M-9,18 L0,12 L9,18 L0,26 Z" fill="#E87020" stroke="#2C1808" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="-8" y1="19" x2="8" y2="19" stroke="#2C1808" stroke-width="1.2"/>
  <!-- left eye -->
  <circle cx="-22" cy="10" r="14" fill="white" stroke="#2C1808" stroke-width="3.5"/>
  <circle cx="-21" cy="10" r="9" fill="#2C1808"/>
  <circle cx="-18" cy="6" r="3.5" fill="white"/>
  <circle cx="-23" cy="15" r="1.5" fill="white" opacity="0.5"/>
  <!-- right eye -->
  <circle cx="22" cy="10" r="14" fill="white" stroke="#2C1808" stroke-width="3.5"/>
  <circle cx="23" cy="10" r="9" fill="#2C1808"/>
  <circle cx="26" cy="6" r="3.5" fill="white"/>
  <circle cx="21" cy="15" r="1.5" fill="white" opacity="0.5"/>
