  <line x1="-70" y1="102" x2="-68" y2="111" stroke="#2C1808" stroke-width="2" stroke-linecap="round"/>
  <line x1="-61" y1="103" x2="-61" y2="112" stroke="#2C1808" stroke-width="2" stroke-linecap="round"/>
  <!-- right wing drooping down -->
  <path d="M65,68 C80,62 84,82 76,96 C70,106 58,102 56,88 Z" fill="#E8C010" stroke="#2C1808" stroke-width="4" stroke-linejoin="round"/>
  <line x1="78" y1="97" x2="74" y2="106" stroke="#2C1808" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="102" x2="68" y2="111" stroke="#2C1808" stroke-width="2" stroke-linecap="round"/>
  <line x1="61" y1="103" x2="61" y2="112" stroke="#2C1808" stroke-width="2" stroke-linecap="round"/>
  <!-- left foot -->
  <ellipse cx="-20" cy="130" rx="14" ry="7" fill="#E87020" stroke="#2C1808" stroke-width="3"/>
  <line x1="-30" y1="132" x2="-36" y2="140" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-20" y1="134" x2="-20" y2="142" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-10" y1="132" x2="-6" y2="140" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <!-- right foot -->
  <ellipse cx="20" cy="130" rx="14" ry="7" fill="#E87020" stroke="#2C1808" stroke-width="3"/>
  <line x1="10" y1="132" x2="6" y2="140" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="134" x2="20" y2="142" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="132" x2="36" y2="140" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <!-- drooping shorter comb -->
  <path d="M-14,-8 C-18,-22 -10,-30 0,-24 C10,-30 18,-22 14,-8 Z" fill="#D44020" stroke="#2C1808" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- wattle -->
  <ellipse cx="16" cy="28" rx="6" ry="8" fill="#FF9E9E" stroke="#2C1808" stroke-width="2"/>
  <!-- sad frown -->
  <path d="M-9,24 Q0,18 9,24" stroke="#2C1808" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- left eye pupils looking down -->
  <circle cx="-22" cy="10" r="14" fill="white" stroke="#2C1808" stroke-width="3.5"/>
  <circle cx="-22" cy="13" r="9" fill="#2C1808"/>
  <circle cx="-19" cy="9" r="3.5" fill="white"/>
  <circle cx="-23" cy="18" r="1.5" fill="white" opacity="0.4"/>
  <!-- right eye pupils looking down -->
  <circle cx="22" cy="10" r="14" fill="white" stroke="#2C1808" stroke-width="3.5"/>
  <circle cx="22" cy="13" r="9" fill="#2C1808"/>
  <circle cx="25" cy="9" r="3.5" fill="white"/>
  <circle cx="21" cy="18" r="1.5" fill="white" opacity="0.4"/>
  <!-- disappointed brows sad arch high center drooping outside -->
  <path d="M-34,-2 Q-22,-10 -10,-4" stroke="#2C1808" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M10,-4 Q22,-10 34,-2" stroke="#2C1808" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- light sad blush -->
  <ellipse cx="-34" cy="22" rx="9" ry="5.5" fill="#F09080" opacity="0.3"/>
  <ellipse cx="34" cy="22" rx="9" ry="5.5" fill="#F09080" opacity="0.3"/>
</svg>
