<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -20 140 165" width="200" height="200">
  <!-- shadow smaller when resting -->
  <ellipse cx="0" cy="132" rx="34" ry="5" fill="#111111" opacity="0.2"/>
  <!-- body blob slightly muted colour -->
  <path d="M0,-10 C-52,-10 -65,28 -65,72 C-65,114 -36,132 0,132 C36,132 65,114 65,72 C65,28 52,-10 0,-10 Z" fill="#E8C818" stroke="#2C1808" stroke-width="5" stroke-linejoin="round"/>
  <!-- belly highlight -->
  <ellipse cx="0" cy="85" rx="32" ry="36" fill="#FFF5A0" opacity="0.35"/>
  <!-- left wing fully folded flat -->
  <path d="M-65,66 C-76,60 -78,76 -72,88 C-68,96 -58,92 -58,80 Z" fill="#D8B010" stroke="#2C1808" stroke-width="4" stroke-linejoin="round"/>
  <!-- right wing fully folded flat -->
  <path d="M65,66 C76,60 78,76 72,88 C68,96 58,92 58,80 Z" fill="#D8B010" stroke="#2C1808" stroke-width="4" stroke-linejoin="round"/>
  <!-- left foot -->
  <ellipse cx="-20" cy="130" rx="14" ry="7" fill="#D87018" stroke="#2C1808" stroke-width="3"/>
  <line x1="-30" y1="132" x2="-36" y2="140" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-20" y1="134" x2="-20" y2="142" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-10" y1="132" x2="-6" y2="140" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <!-- right foot -->
  <ellipse cx="20" cy="130" rx="14" ry="7" fill="#D87018" stroke="#2C1808" stroke-width="3"/>
  <line x1="10" y1="132" x2="6" y2="140" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="134" x2="20" y2="142" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="132" x2="36" y2="140" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <!-- sleepy drooping comb -->
  <path d="M-12,-8 C-14,-20 -8,-26 0,-22 C8,-26 14,-20 12,-8 Z" fill="#B83818" stroke="#2C1808" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- wattle muted -->
  <ellipse cx="14" cy="28" rx="5" ry="7" fill="#FF9E9E" stroke="#2C1808" stroke-width="2" opacity="0.7"/>
  <!-- closed beak small smile -->
  <path d="M-7,20 Q0,24 7,20" stroke="#2C1808" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- closed eyes just curved lines -->
  <path d="M-34,10 Q-22,4 -10,10" stroke="#2C1808" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M10,10 Q22,4 34,10" stroke="#2C1808" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- relaxed brows very gentle -->
  <path d="M-32,-2 Q-22,-5 -12,-2" stroke="#2C1808" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M12,-2 Q22,-5 32,-2" stroke="#2C1808" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- very soft blush -->
  <ellipse cx="-32" cy="20" rx="9" ry="5.5" fill="#F09080" opacity="0.22"/>
  <ellipse cx="32" cy="20" rx="9" ry="5.5" fill="#F09080" opacity="0.22"/>
  <!-- Zzz floating -->
  <text x="36" y="-2" font-size="14" fill="#666666" font-weight="bold" font-family="Arial, sans-serif">z</text>
  <text x="47" y="-11" font-size="11" fill="#555555" font-weight="bold" font-family="Arial, sans-serif">z</text>
  <text x="56" y="-18" font-size="8" fill="#444444" font-weight="bold" font-family="Arial, sans-serif">z</text>
</svg>
