  <line x1="-73" y1="80" x2="-71" y2="88" stroke="#2C1808" stroke-width="2" stroke-linecap="round"/>
  <line x1="-64" y1="80" x2="-64" y2="89" stroke="#2C1808" stroke-width="2" stroke-linecap="round"/>
  <!-- right wing raised proud -->
  <path d="M65,52 C82,42 90,58 85,74 C80,86 66,83 60,72 Z" fill="#E8C010" stroke="#2C1808" stroke-width="4" stroke-linejoin="round"/>
  <line x1="82" y1="76" x2="78" y2="84" stroke="#2C1808" stroke-width="2" stroke-linecap="round"/>
  <line x1="73" y1="80" x2="71" y2="88" stroke="#2C1808" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="80" x2="64" y2="89" stroke="#2C1808" stroke-width="2" stroke-linecap="round"/>
  <!-- left foot -->
  <ellipse cx="-20" cy="130" rx="14" ry="7" fill="#E87020" stroke="#2C1808" stroke-width="3"/>
  <line x1="-30" y1="132" x2="-36" y2="140" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-20" y1="134" x2="-20" y2="142" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-10" y1="132" x2="-6" y2="140" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <!-- right foot -->
  <ellipse cx="20" cy="130" rx="14" ry="7" fill="#E87020" stroke="#2C1808" stroke-width="3"/>
  <line x1="10" y1="132" x2="6" y2="140" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="134" x2="20" y2="142" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="132" x2="36" y2="140" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
