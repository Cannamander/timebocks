  <ellipse cx="0" cy="85" rx="32" ry="36" fill="#FFF5A0" opacity="0.45"/>
  <!-- body gloss -->
  <ellipse cx="-18" cy="12" rx="12" ry="8" fill="white" opacity="0.20" transform="rotate(-20,-18,12)"/>
  <!-- left wing raised proud -->
  <path d="M-65,52 C-82,42 -90,58 -85,74 C-80,86 -66,83 -60,72 Z" fill="#E8C010" stroke="#2C1808" stroke-width="4" stroke-linejoin="round"/>
