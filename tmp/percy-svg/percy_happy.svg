  <path d="M-14,-8 C-18,-26 -8,-36 0,-28 C8,-36 18,-26 14,-8 Z" fill="#D44020" stroke="#2C1808" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- wattle -->
  <ellipse cx="16" cy="28" rx="6" ry="8" fill="#FF9E9E" stroke="#2C1808" stroke-width="2"/>
  <!-- beak open happy -->
  <path d="M-10,16 Q0,28 10,16" fill="#E87020" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M-10,16 Q0,22 10,16" fill="#2C1808"/>
  <!-- left eye larger -->
  <circle cx="-22" cy="10" r="14" fill="white" stroke="#2C1808" stroke-width="3.5"/>
  <circle cx="-21" cy="10" r="9.5" fill="#2C1808"/>
  <circle cx="-18" cy="5.5" r="4" fill="white"/>
  <circle cx="-24" cy="15" r="1.8" fill="white" opacity="0.6"/>
  <!-- right eye larger -->
  <circle cx="22" cy="10" r="14" fill="white" stroke="#2C1808" stroke-width="3.5"/>
  <circle cx="23" cy="10" r="9.5" fill="#2C1808"/>
  <circle cx="26" cy="5.5" r="4" fill="white"/>
  <circle cx="20" cy="15" r="1.8" fill="white" opacity="0.6"/>
  <!-- happy brows arched upward -->
  <path d="M-34,-8 Q-22,-16 -10,-8" stroke="#2C1808" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M10,-8 Q22,-16 34,-8" stroke="#2C1808" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- heavy blush -->
  <ellipse cx="-34" cy="22" rx="10" ry="6" fill="#F09080" opacity="0.55"/>
  <ellipse cx="34" cy="22" rx="10" ry="6" fill="#F09080" opacity="0.55"/>
  <!-- sparkles -->
  <circle cx="-52" cy="-8" r="3" fill="#FFD040" opacity="0.8"/>
  <circle cx="-46" cy="-14" r="2" fill="#FFD040" opacity="0.6"/>
  <circle cx="46" cy="-10" r="3" fill="#FFD040" opacity="0.8"/>
  <circle cx="52" cy="-16" r="2" fill="#FFD040" opacity="0.6"/>
  <line x1="-52" y1="-14" x2="-52" y2="-2" stroke="#FFD040" stroke-width="1.5" opacity="0.7"/>
  <line x1="-58" y1="-8" x2="-46" y2="-8" stroke="#FFD040" stroke-width="1.5" opacity="0.7"/>
  <line x1="46" y1="-16" x2="46" y2="-4" stroke="#FFD040" stroke-width="1.5" opacity="0.7"/>
  <line x1="40" y1="-10" x2="52" y2="-10" stroke="#FFD040" stroke-width="1.5" opacity="0.7"/>
