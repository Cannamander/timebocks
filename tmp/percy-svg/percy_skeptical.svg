<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -20 140 165" width="200" height="200">
  <!-- shadow -->
  <ellipse cx="0" cy="132" rx="38" ry="6" fill="#111111" opacity="0.3"/>
  <!-- body blob -->
  <path d="M0,-10 C-52,-10 -65,28 -65,72 C-65,114 -36,132 0,132 C36,132 65,114 65,72 C65,28 52,-10 0,-10 Z" fill="#F5D020" stroke="#2C1808" stroke-width="5" stroke-linejoin="round"/>
  <!-- belly highlight -->
  <ellipse cx="0" cy="85" rx="32" ry="36" fill="#FFF5A0" opacity="0.45"/>
  <!-- body gloss -->
  <ellipse cx="-18" cy="12" rx="12" ry="8" fill="white" opacity="0.18" transform="rotate(-20,-18,12)"/>
  <!-- left wing crossed front -->
  <path d="M-65,62 C-78,52 -82,70 -74,82 C-66,90 -54,84 -52,72 Z" fill="#E8C010" stroke="#2C1808" stroke-width="4" stroke-linejoin="round"/>
  <path d="M-56,68 C-44,60 -36,70 -38,82 C-40,90 -52,88 -54,78 Z" fill="#E8C010" stroke="#2C1808" stroke-width="4" stroke-linejoin="round"/>
  <!-- right wing crossed front -->
  <path d="M65,62 C78,52 82,70 74,82 C66,90 54,84 52,72 Z" fill="#E8C010" stroke="#2C1808" stroke-width="4" stroke-linejoin="round"/>
  <path d="M56,68 C44,60 36,70 38,82 C40,90 52,88 54,78 Z" fill="#E8C010" stroke="#2C1808" stroke-width="4" stroke-linejoin="round"/>
  <!-- left foot -->
  <ellipse cx="-20" cy="130" rx="14" ry="7" fill="#E87020" stroke="#2C1808" stroke-width="3"/>
  <line x1="-30" y1="132" x2="-36" y2="140" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-20" y1="134" x2="-20" y2="142" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-10" y1="132" x2="-6" y2="140" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <!-- right foot -->
  <ellipse cx="20" cy="130" rx="14" ry="7" fill="#E87020" stroke="#2C1808" stroke-width="3"/>
  <line x1="10" y1="132" x2="6" y2="140" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="134" x2="20" y2="142" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="132" x2="36" y2="140" stroke="#2C1808" stroke-width="2.5" stroke-linecap="round"/>
  <!-- comb -->
  <path d="M-14,-8 C-18,-26 -8,-36 0,-28 C8,-36 18,-26 14,-8 Z" fill="#D44020" stroke="#2C1808" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- wattle -->
  <ellipse cx="16" cy="28" rx="6" ry="8" fill="#FF9E9E" stroke="#2C1808" stroke-width="2"/>
  <!-- slight frown -->
  <path d="M-8,22 Q0,18 8,22" stroke="#2C1808" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- left eye half-lidded pupils sideways -->
  <circle cx="-22" cy="10" r="14" fill="white" stroke="#2C1808" stroke-width="3.5"/>
  <circle cx="-20" cy="11" r="9" fill="#2C1808"/>
  <circle cx="-17" cy="7" r="3.5" fill="white"/>
  <circle cx="-22" cy="16" r="1.5" fill="white" opacity="0.5"/>
  <!-- half lid on left eye -->
  <path d="M-36,4 Q-22,0 -8,4" stroke="#2C1808" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- right eye pupils sideways -->
  <circle cx="22" cy="10" r="14" fill="white" stroke="#2C1808" stroke-width="3.5"/>
  <circle cx="24" cy="11" r="9" fill="#2C1808"/>
  <circle cx="27" cy="7" r="3.5" fill="white"/>
  <circle cx="21" cy="16" r="1.5" fill="white" opacity="0.5"/>
  <!-- skeptical brows left flat right raised -->
  <path d="M-34,-3 Q-22,-5 -10,-3" stroke="#2C1808" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M10,-10 Q22,-16 34,-8" stroke="#2C1808" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- no blush - unimpressed -->
</svg>
